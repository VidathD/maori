<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Support Team Maori in the Stridian competition by MHC, University of Moratuwa.">
  <title>Team Maori | Stridian × MHC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-image" role="img" aria-label="Team Maori by the sea in traditional costume"></div>
      <div class="hero-image hero-image-next" aria-hidden="true"></div>
      <div class="hero-wash"></div>
      <button class="photo-arrow photo-arrow-prev" id="previous-photo" type="button" aria-label="Show previous photo" title="Previous photo">&lt;</button>
      <button class="photo-arrow photo-arrow-next" id="next-photo" type="button" aria-label="Show next photo" title="Next photo">&gt;</button>
      <header class="topbar">
        <a class="wordmark" href="index.html" aria-label="Team Maori home"><span>MAO</span>RI</a>
        <p class="event-label">STRIDIAN <i>/</i> MHC 2024</p>
      </header>
      <div class="hero-content">
        <p class="eyebrow">A call from the coast</p>
        <h1 id="page-title">Stand with<br><em>Maori.</em></h1>
        <p class="hero-copy">Every reaction helps our team move forward. Like the post, follow the Mora Hiking Club page, and help Team Maori carry the energy of the coast into Stridian.</p>
        <div class="hero-actions">
          <a class="primary-button" href="https://www.facebook.com/share/p/18GUnT3urx/" target="_blank" rel="noopener noreferrer">
            <span class="button-icon">♥</span> Like our post
          </a>
          <a class="text-link" href="https://www.facebook.com/MoraHikingClub/" target="_blank" rel="noopener noreferrer">Follow MHC <span>↗</span></a>
        </div>
      </div>
      <div class="hero-countdown" aria-live="polite">
        <span class="countdown-number" id="countdown-number">10</span>
        <span class="countdown-label">Opening our<br>Facebook post</span>
        <button class="stop-button" id="stop-countdown" type="button">Stay here</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
